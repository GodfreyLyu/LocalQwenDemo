[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ollama-llm-service"
version = "1.0.0"
description = "Generic bounded Thrift generation service supervising local Ollama"
requires-python = ">=3.12,<3.16"
dependencies = ["httpx==0.28.1", "thrift==0.25.0", "pydantic-settings==2.15.0", "local-llm-contract==1.0.0"]

[project.scripts]
llm-service = "llm_service.runtime:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
