# Apply only after approved format-3 release and initial child-app verification.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-platform-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GodfreyLyu/LocalQwenDemo.git
    targetRevision: deployment-release
    path: deploy/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
