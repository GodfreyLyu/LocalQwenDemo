[pytest]
testpaths = backend/tests scripts/tests
pythonpath = . backend scripts
consider_namespace_packages = true
addopts = -q --strict-markers --import-mode=importlib
markers =
    unit: isolated logic with controlled collaborators
    component: collaborating application modules with external service doubles
    integration: real storage, filesystem, process, network or CLI boundaries
    e2e: complete deployed application journey
    requires_helm: executes the Helm CLI locally without a cluster
    requires_kubectl: executes kubectl for offline rendering or a test-owned API
    requires_git: uses temporary Git repositories and local remotes
    loopback: binds or connects to test-owned loopback sockets
    real_model: opt-in inference using the configured local Ollama service
    requires_cluster: explicit acceptance against a live deployment
    security: authentication, privacy, isolation or resource ownership
    contract: public API, protocol, configuration or output invariants
    recovery: interruption, retries, restart or persisted-state recovery
