name: Quality checks
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    name: App and script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install Python dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.lock
          backend/.venv/bin/pip install --no-deps -e backend
      - name: Lint and test Python
        working-directory: backend
        run: |
          .venv/bin/ruff check --config pyproject.toml app tests
          .venv/bin/ruff format --check --config pyproject.toml app tests
          .venv/bin/ruff check --config pyproject.toml ../deploy/images/ollama-vulkan/runtime.py
          .venv/bin/ruff format --check --config pyproject.toml ../deploy/images/ollama-vulkan/runtime.py
          .venv/bin/pytest tests -m 'not real_model and not requires_cluster'
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Check scripts
        run: scripts/check_scripts.sh
      - name: Lint, test, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Run browser tests
        working-directory: frontend
        env:
          LOCAL_REVIEW_TEST_ROOT: ${{ runner.temp }}/local-qwen-browser
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: ${{ runner.temp }}/local-qwen-browser/results
          retention-days: 3
  configuration:
    name: Kubernetes schemas
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Check Kubernetes schemas
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_helm_schema.sh

  main-ci:
    # Required by branch protection; keep this check name stable.
    name: main-ci
    if: always()
    needs: [application, configuration]
    runs-on: ubuntu-latest
    steps:
      - name: Check required results
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          CONFIGURATION_RESULT: ${{ needs.configuration.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$CONFIGURATION_RESULT" = success
