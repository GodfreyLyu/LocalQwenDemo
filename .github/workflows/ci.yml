name: Quality checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend without model weights
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.lock
          backend/.venv/bin/pip install --no-deps -e backend
      - name: Backend lint and tests
        working-directory: backend
        run: |
          .venv/bin/ruff check --config pyproject.toml app tests ../scripts
          .venv/bin/ruff format --check --config pyproject.toml app tests ../scripts
          .venv/bin/pytest
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - name: Offline script regressions (no cluster writes)
        run: scripts/check_scripts.sh
      - name: Frontend lint, tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Critical browser tests against local API and emulated DynamoDB
        working-directory: frontend
        env:
          LOCAL_REVIEW_TEST_ROOT: ${{ runner.temp }}/local-qwen-browser
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: ${{ runner.temp }}/local-qwen-browser/results
          retention-days: 3
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.3
      - name: Render and validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/kustomize/overlays/minikube > /tmp/review-minikube.yaml
          python scripts/validate_manifests.py
