name: Deployment validation
on:
  workflow_call:
    inputs:
      snapshot-sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      snapshot-sha:
        description: Exact deployment candidate commit SHA to validate
        type: string
        required: true
permissions:
  contents: read
  statuses: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot-sha }}
        run: '[[ "$SNAPSHOT_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: main
          path: validator
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.snapshot-sha }}
          path: snapshot
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: pip install pyyaml==6.0.3
      - name: Verify immutable head and current release base
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.snapshot-sha }}
        run: python validator/scripts/release/publish.py verify --root validator --candidate-sha "$CANDIDATE_SHA"
      - name: Validate snapshot using trusted main code
        run: python validator/scripts/validate_helm.py --root snapshot --snapshot
      - name: Validate Kubernetes resource schemas
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash validator/scripts/check_helm_schema.sh snapshot
      - name: Recheck candidate provenance after validation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.snapshot-sha }}
        run: python validator/scripts/release/publish.py verify --root validator --candidate-sha "$CANDIDATE_SHA"
      - name: Record status on the exact candidate commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ inputs.snapshot-sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SNAPSHOT_SHA" -f state="$state" -f context=deployment/snapshot -f description="Helm snapshot validation: $state" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
