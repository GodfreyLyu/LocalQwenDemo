name: Release PR validation
on:
  pull_request_target:
    branches: [deployment-release]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  statuses: write
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: GodfreyLyu/LocalQwenDemo/.github/workflows/deployment-validation.yml@main
    with:
      snapshot-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      statuses: write
