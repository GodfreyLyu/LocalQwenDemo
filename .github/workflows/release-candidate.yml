name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild all three images even if build inputs are unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deployment-release-candidate
  cancel-in-progress: false
jobs:
  quality:
    name: Quality checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  candidate:
    name: Build images and open PR
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      pull-requests: write
      statuses: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
      candidate_sha: ${{ steps.publish.outputs.candidate_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml==6.0.3
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Plan release
        id: plan
        env:
          REBUILD: ${{ inputs.rebuild || false }}
        run: |
          args=()
          if [ "$REBUILD" = true ]; then args+=(--force); fi
          python scripts/release/publish.py prepare --workspace "$RUNNER_TEMP/release" "${args[@]}"
      - name: Set up CPU emulation
        uses: docker/setup-qemu-action@v3
        if: steps.plan.outputs.materialize == 'true'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.materialize == 'true'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.plan.outputs.materialize == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push backend image
        id: backend
        if: steps.plan.outputs.backend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.backend_repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend image
        id: frontend
        if: steps.plan.outputs.frontend_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.frontend_repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build and push Ollama image
        id: ollama
        if: steps.plan.outputs.ollama_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/images/ollama-vulkan
          platforms: linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.ollama_repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ollama
          cache-to: type=gha,mode=max,scope=ollama
      - name: Create and check snapshot
        if: steps.plan.outputs.materialize == 'true'
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest || steps.plan.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest || steps.plan.outputs.frontend_digest }}
          BACKEND_REPOSITORY: ${{ steps.plan.outputs.backend_repository }}
          OLLAMA_DIGEST: ${{ steps.ollama.outputs.digest || steps.plan.outputs.ollama_digest }}
          OLLAMA_REPOSITORY: ${{ steps.plan.outputs.ollama_repository }}
          FRONTEND_REPOSITORY: ${{ steps.plan.outputs.frontend_repository }}
        run: |
          docker buildx imagetools inspect "$BACKEND_REPOSITORY@$BACKEND_DIGEST"
          docker buildx imagetools inspect "$FRONTEND_REPOSITORY@$FRONTEND_DIGEST"
          docker buildx imagetools inspect "$OLLAMA_REPOSITORY@$OLLAMA_DIGEST"
          python scripts/release/snapshot.py render --plan "$RUNNER_TEMP/release/plan.json" --output "$RUNNER_TEMP/release/candidate" --backend-digest "$BACKEND_DIGEST" --frontend-digest "$FRONTEND_DIGEST" --ollama-digest "$OLLAMA_DIGEST"
          python scripts/validate_helm.py --root "$RUNNER_TEMP/release/candidate" --snapshot
      - name: Open release PR
        id: publish
        run: python scripts/release/publish.py publish --workspace "$RUNNER_TEMP/release"
  validate-candidate:
    name: Validate snapshot
    needs: candidate
    if: needs.candidate.outputs.published == 'true'
    uses: ./.github/workflows/deployment-validation.yml
    with:
      snapshot-sha: ${{ needs.candidate.outputs.candidate_sha }}
    permissions:
      contents: read
      statuses: write
      pull-requests: read
  supersede:
    name: Close older release PRs
    needs: [candidate, validate-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml==6.0.3
      - name: Close older release PRs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
        run: python scripts/release/publish.py supersede --candidate-sha "$CANDIDATE_SHA"
