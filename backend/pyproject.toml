[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-code-review"
version = "1.0.0"
description = "Persistent, independent code reviews using backend-only Qwen3 inference"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "boto3>=1.40,<2",
  "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
model = ["torch>=2.7,<3", "transformers>=4.53,<5", "huggingface-hub>=0.34,<1"]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.12,<1", "moto[dynamodb]>=5,<6", "pyyaml>=6,<7", "numpy>=2,<3", "safetensors>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_model: opt-in download and CPU inference using the pinned real model"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
