# Stable release names preserve application data and signing secret ownership.
backend:
  replicas: 1
  image:
    repository: review-backend
    tag: local
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: '2'
      memory: 4Gi
      ephemeral-storage: 256Mi
    limits:
      cpu: '2'
      memory: 6Gi
      ephemeral-storage: 1Gi
inference:
  host: review-ollama.local-inference.svc.cluster.local
  port: 9091
  socketTimeoutSeconds: 2
  recoverySeconds: 20
frontend:
  image:
    repository: review-frontend
    tag: local
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 200m
      memory: 96Mi
      ephemeral-storage: 128Mi
dynamodb:
  image:
    repository: amazon/dynamodb-local
    tag: 3.1.0
    digest: ''
    pullPolicy: IfNotPresent
  table: llm-review-users
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 256Mi
imagePullSecrets: []
signingSecret:
  existingSecret: review-secrets
persistence:
  storageClass: standard
  history:
    size: 10Gi
    existingClaim: ''
  dynamodb:
    size: 1Gi
    existingClaim: ''
volumePermissions:
  enabled: true
model:
  expectedId: qwen3:1.7b
  expectedRevision: sha256:8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
  maxOutputTokens: 384
  timeoutSeconds: 300
config:
  allowedOrigin: http://localhost:8080
  cookieSecure: false
  enableApiDocs: false
  queueCapacity: 8
  maxRetries: 1
  sourceMaxChars: 12000
  sessionTtlSeconds: 1800
  deploymentEnvironment: minikube
  releaseSha: ''
startupTimeoutSeconds: 3600
monitoring:
  enabled: false
  namespace: monitoring
  release: monitoring
  intervalSeconds: 30
  scrapeTimeoutSeconds: 10
  sampleLimit: 5000
  prometheusPodLabels:
    app.kubernetes.io/name: prometheus
    prometheus: monitoring-kube-prometheus-prometheus
  alerts:
    enabled: true
    minimumCompletedReviews: 5
    failureRatio: 0.5
    runbookUrl: https://github.com/GodfreyLyu/LocalQwenDemo/blob/main/docs/operations/observability.md
  dashboards:
    enabled: true
  ollamaNamespace: local-inference
  ollamaRelease: review-ollama
networkPolicy:
  enabled: true
  inferenceNamespace: local-inference
  inferenceRelease: review-ollama
