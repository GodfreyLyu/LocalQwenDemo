# One release per namespace; fixed Service names preserve local endpoint validation.
backend:
  replicas: 1
  image:
    repository: review-backend
    tag: local
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: '2'
      memory: 4Gi
      ephemeral-storage: 256Mi
    limits:
      cpu: '2'
      memory: 6Gi
      ephemeral-storage: 1Gi
frontend:
  image:
    repository: review-frontend
    tag: local
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 200m
      memory: 96Mi
      ephemeral-storage: 128Mi
dynamodb:
  image:
    repository: amazon/dynamodb-local
    tag: 3.1.0
    digest: ''
    pullPolicy: IfNotPresent
  table: llm-review-users
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 256Mi
imagePullSecrets: []
signingSecret:
  # Pre-create in the release namespace with a stable SIGNING_SECRET (>=32 characters).
  existingSecret: review-secrets
persistence:
  storageClass: standard
  history:
    size: 10Gi
    existingClaim: ''
  modelCache:
    size: 12Gi
    existingClaim: ''
  dynamodb:
    size: 1Gi
    existingClaim: ''
volumePermissions:
  enabled: true
model:
  backend: ollama
  ollamaBaseUrl: http://review-ollama.local-inference.svc.cluster.local:11434
  ollamaModel: qwen3:1.7b
  ollamaModelDigest: sha256:8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
  id: Qwen/Qwen3-1.7B
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  dtype: bfloat16
  maxInputTokens: 2048
  maxOutputTokens: 384
  cpuThreads: 2
  timeoutSeconds: 300
config:
  allowedOrigin: http://localhost:8080
  cookieSecure: false
  enableApiDocs: false
  queueCapacity: 8
  maxRetries: 1
  sourceMaxChars: 12000
  sessionTtlSeconds: 1800
  deploymentEnvironment: minikube
  releaseSha: ''
startupTimeoutSeconds: 3600
networkPolicy:
  # Use values-minikube.yaml for the local profile without network isolation.
  enabled: true
  # For explicit host Ollama: clear ollamaNamespace and set one private IPv4 /32.
  ollamaHostCidr: ''
  # Independent local-ollama release used by the default endpoint.
  ollamaNamespace: local-inference
  ollamaRelease: review-ollama
