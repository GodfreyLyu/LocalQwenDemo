apiVersion: v1
data:
  {{- include "review.modelEnvironment" . | nindent 2 }}
  ALLOWED_ORIGIN: {{ .Values.config.allowedOrigin | toString | quote }}
  AWS_REGION: ap-northeast-1
  COOKIE_SECURE: {{ .Values.config.cookieSecure | toString | quote }}
  DATA_DIR: /data
  DEPLOYMENT_ENVIRONMENT: {{ .Values.config.deploymentEnvironment | toString | quote }}
  DYNAMODB_ENDPOINT_URL: http://review-dynamodb:8000
  DYNAMODB_TABLE: {{ .Values.dynamodb.table | toString | quote }}
  ENVIRONMENT: local
  HOME: /tmp
  THRIFT_HOST: {{ .Values.inference.host | quote }}
  THRIFT_PORT: {{ .Values.inference.port | toString | quote }}
  THRIFT_SOCKET_TIMEOUT_SECONDS: {{ .Values.inference.socketTimeoutSeconds | toString | quote }}
  THRIFT_RECOVERY_SECONDS: {{ .Values.inference.recoverySeconds | toString | quote }}
  THRIFT_STARTUP_TIMEOUT_SECONDS: {{ .Values.startupTimeoutSeconds | toString | quote }}
  MAX_RETRIES: {{ .Values.config.maxRetries | toString | quote }}
  QUEUE_CAPACITY: {{ .Values.config.queueCapacity | toString | quote }}
  SESSION_TTL_SECONDS: {{ .Values.config.sessionTtlSeconds | toString | quote }}
  SOURCE_MAX_CHARS: {{ .Values.config.sourceMaxChars | toString | quote }}
  ENABLE_API_DOCS: {{ .Values.config.enableApiDocs | toString | quote }}
{{- if .Values.config.releaseSha }}
  RELEASE_SHA: {{ .Values.config.releaseSha | quote }}
{{- end }}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: local-review-demo
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  name: review-config
  namespace: {{ .Release.Namespace | quote }}
