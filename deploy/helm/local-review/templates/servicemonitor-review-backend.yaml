{{- if .Values.monitoring.enabled }}
{{- if gt (int .Values.monitoring.scrapeTimeoutSeconds) (int .Values.monitoring.intervalSeconds) }}
{{- fail "monitoring.scrapeTimeoutSeconds must not exceed monitoring.intervalSeconds" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: review-backend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "review.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.release | quote }}
spec:
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  sampleLimit: {{ .Values.monitoring.sampleLimit }}
  endpoints:
  - port: http
    path: /metrics
    interval: {{ printf "%ds" (int .Values.monitoring.intervalSeconds) }}
    scrapeTimeout: {{ printf "%ds" (int .Values.monitoring.scrapeTimeoutSeconds) }}
    honorLabels: false
{{- end }}
