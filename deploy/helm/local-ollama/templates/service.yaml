apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ollama.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
