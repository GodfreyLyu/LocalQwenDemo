apiVersion: v1
kind: ConfigMap
metadata:
  name: review-config
data:
  ENVIRONMENT: local
  ALLOWED_ORIGIN: http://localhost:8080
  COOKIE_SECURE: 'false'
  DATA_DIR: /data
  OLLAMA_BASE_URL: http://review-ollama.local-inference.svc.cluster.local:11434
  OLLAMA_MODEL: qwen3:1.7b
  OLLAMA_MODEL_DIGEST: sha256:8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7
  MODEL_MAX_INPUT_TOKENS: '2048'
  MODEL_MAX_OUTPUT_TOKENS: '384'
  MODEL_INFERENCE_CONCURRENCY: '1'
  INFERENCE_TIMEOUT_SECONDS: '300'
  QUEUE_CAPACITY: '8'
  MAX_RETRIES: '1'
  SOURCE_MAX_CHARS: '12000'
  SESSION_TTL_SECONDS: '1800'
  AWS_REGION: ap-northeast-1
  DYNAMODB_TABLE: llm-review-users
  DYNAMODB_ENDPOINT_URL: http://review-dynamodb:8000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_CONFIG_FILE: /dev/null
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  HOME: /tmp
  MODEL_CONTEXT_TOKENS: "4096"
  MODEL_KEEP_ALIVE: "5m"
  MODEL_TEMPERATURE: "0.7"
  MODEL_TOP_P: "0.8"
  MODEL_TOP_K: "20"
  MODEL_MIN_P: "0"
  MODEL_REPEAT_PENALTY: "1"
