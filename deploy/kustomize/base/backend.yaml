apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 2100
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: review-backend
  template:
    metadata:
      labels:
        app: review-backend
    spec:
      serviceAccountName: review-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: review-backend
        image: review-backend:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 256Mi
          limits:
            cpu: '2'
            memory: 6Gi
            ephemeral-storage: 1Gi
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: history
          mountPath: /data
        - name: model-cache
          mountPath: /models/huggingface
        envFrom:
        - configMapRef:
            name: review-config
        - secretRef:
            name: review-secrets
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: history
        persistentVolumeClaim:
          claimName: review-history
      - name: model-cache
        persistentVolumeClaim:
          claimName: review-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: review-backend
spec:
  selector:
    app: review-backend
  ports:
  - name: http
    port: 8000
    targetPort: http
