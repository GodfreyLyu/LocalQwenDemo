# Bootstrap once using a maintainer identity. Generation preserves this entrypoint.
name: Release PR validation
on:
  pull_request:
    branches: [deployment-release]
permissions:
  contents: read
  statuses: write
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: GodfreyLyu/LocalQwenDemo/.github/workflows/deployment-validation.yml@main
    with:
      snapshot-sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      statuses: write
