[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-contract"
version = "1.0.0"
description = "Shared generated Apache Thrift LLM bindings"
requires-python = ">=3.12"
dependencies = ["thrift==0.25.0"]

[tool.setuptools.packages.find]
where = ["python"]
